name: otagai

x-backend-env: &backend_env
  DATABASE_HOST: "${DATABASE_HOST:?Set DATABASE_HOST}"
  DATABASE_PORT: "${DATABASE_PORT:-6543}"
  MIGRATION_DATABASE_HOST: "${MIGRATION_DATABASE_HOST:?Set MIGRATION_DATABASE_HOST}"
  MIGRATION_DATABASE_PORT: "${MIGRATION_DATABASE_PORT:-5432}"
  POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
  POSTGRES_DB: "${POSTGRES_DB:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
  DATABASE_SSL_MODE: "${DATABASE_SSL_MODE:-verify-full}"
  DATABASE_SSL_ROOT_CERT: "${DATABASE_SSL_ROOT_CERT:-app/database/certs/supabase-prod-ca-2021.crt}"
  SUPABASE_URL: "${SUPABASE_URL:?Set SUPABASE_URL}"
  REDIS_HOST: redis
  REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
  S3_ENDPOINT_URL: http://s3:9000
  S3_PUBLIC_ENDPOINT_URL: "${S3_PUBLIC_ENDPOINT_URL:?Set S3_PUBLIC_ENDPOINT_URL}"
  S3_BUCKET: "${S3_BUCKET:-otagai-media}"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY:-otagai}"
  S3_SECRET_KEY: "${S3_SECRET_KEY:?Set S3_SECRET_KEY}"
  S3_CREATE_BUCKET: "true"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS:-}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-}"
  SMTP_FROM: "${SMTP_FROM:-}"
  SMTP_USERNAME: "${SMTP_USERNAME:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_TLS: "${SMTP_TLS:-}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_MODEL: "${OPENAI_MODEL:-}"
  OPENAI_TRANSCRIBE_MODEL: "${OPENAI_TRANSCRIBE_MODEL:-whisper-1}"
  AI_RUN_RETENTION_DAYS: "${AI_RUN_RETENTION_DAYS:-30}"
  EXPO_ACCESS_TOKEN: "${EXPO_ACCESS_TOKEN:-}"

services:
  migrate:
    build: ./backend
    environment: *backend_env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build: ./backend
    environment: *backend_env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  ripple-scheduler:
    build: ./backend
    environment: *backend_env
    command: ["python", "-m", "app.services.requests.scheduler"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  push-dispatch:
    build: ./backend
    environment: *backend_env
    command: ["python", "-m", "app.services.notifications.dispatch"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build: ./backend
    environment: *backend_env
    command: ["dramatiq", "app.services.queue.worker:broker", "--processes", "1", "--threads", "2"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    user: redis
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
    command: ["/bin/sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 4s
      retries: 12

  s3:
    image: rustfs/rustfs:1.0.6
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY:-otagai}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY:?Set S3_SECRET_KEY}"
      RUSTFS_CONSOLE_ENABLE: "false"
    restart: unless-stopped
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 4s
      retries: 12

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?Set APP_DOMAIN}"
      S3_DOMAIN: "${S3_DOMAIN:?Set S3_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - s3

volumes:
  redis_data:
  s3_data:
  caddy_data:
  caddy_config:
