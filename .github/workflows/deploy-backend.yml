name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['backend/**']

permissions: {}

concurrency:
  group: otagai-production-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy the backend
        env:
          DEPLOY_KEY: ${{ secrets.OTAGAI_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OTAGAI_DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          directory=$(mktemp -d)
          trap 'rm -rf -- "$directory"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$directory/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$directory/known_hosts"
          ssh -nT -F /dev/null -i "$directory/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$directory/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            azureuser@20.120.103.114 "deploy $GITHUB_SHA"
