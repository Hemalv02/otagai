services:
  backend:
    build: ./backend
    environment: &backend_environment
      DATABASE_HOST: pgbouncer
      MIGRATION_DATABASE_HOST: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      S3_ENDPOINT_URL: http://s3:9000
      S3_BUCKET: "${S3_BUCKET:-otagai-media}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-otagai}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?Set S3_SECRET_KEY}"
      S3_CREATE_BUCKET: "true"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_TLS: "${SMTP_TLS:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      EXPO_ACCESS_TOKEN: "${EXPO_ACCESS_TOKEN:-}"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"]
      interval: 5s
      timeout: 6s
      retries: 12

  worker:
    profiles: [worker]
    build: ./backend
    environment: *backend_environment
    command: ["dramatiq", "app.services.queue.worker:broker", "--processes", "1", "--threads", "2"]
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_DB: otagai
      POSTGRES_USER: otagai
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -Atqc 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: otagai
      DB_USER: otagai
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "127.0.0.1:6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$DB_PASSWORD\" psql -h 127.0.0.1 -U \"$$DB_USER\" -d \"$$DB_NAME\" -Atqc 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      retries: 12

  redis:
    image: redis:8-alpine
    user: redis
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
    command: ["/bin/sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${OTAGAI_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 4s
      retries: 12

  s3:
    image: rustfs/rustfs:1.0.6
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY:-otagai}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY:?Set S3_SECRET_KEY}"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  s3_data:
