[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiobotocore>=3.10.0",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "dramatiq[redis]>=2.2.1",
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "openai>=3.57.0",
    "openai-agents>=0.25.0",
    "pillow>=13.0.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: tests that require a PostgreSQL database (set DATABASE_HOST).",
]
