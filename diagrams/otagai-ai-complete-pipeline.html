<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Otagai AI pipeline</title>
  <style>
    body { margin: 0; background: #f8f5ed; }
    main { max-width: 1160px; margin: 0 auto; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="598" viewBox="0 0 1160 598"
     role="img" aria-labelledby="otagai-ai-complete-pipeline-title otagai-ai-complete-pipeline-desc">
  <title id="otagai-ai-complete-pipeline-title">Otagai AI pipeline</title>
  <desc id="otagai-ai-complete-pipeline-desc">Three workflows read left to right: the assistant interprets input and searches the circle before a member can post a request; a listing photo produces editable suggestions before publication; pickup photos suggest checklist items that both participants confirm.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans CJK JP", system-ui, sans-serif; fill: #303630; }
      .wordmark { font-size: 17px; font-weight: 600; letter-spacing: 2px; fill: #537257; }
      .title { font-family: Georgia, "Bitstream Charter", serif; font-size: 50px; }
      .subtitle { font-size: 19px; fill: #586057; }
      .column { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; fill: #586057; }
      .japanese { font-size: 19px; font-weight: 600; fill: #537257; }
      .workflow { font-size: 21px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .detail { font-size: 17px; fill: #586057; }
      .divider { stroke: #d9ddd2; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #537257; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-final { stroke: #aa6a52; }
      .stamp { font-family: "Noto Serif CJK JP", serif; font-size: 33px; fill: #9a563f; }
    </style>
    <path id="otagai-ai-arrow" d="M0 0H27M21-6l6 6-6 6"/>
  </defs>

  <rect width="1160" height="598" fill="#f8f5ed"/>
  <path d="M48 42H1112" stroke="#537257" stroke-width="2"/>
  <text x="48" y="83" class="wordmark">OTAGAI · お互い</text>
  <text x="48" y="145" class="title">AI pipeline</text>
  <text x="49" y="184" class="subtitle">From a rough request or photo to a decision in the app.</text>

  <g aria-hidden="true">
    <rect x="1038" y="73" width="74" height="74" rx="10" fill="none" stroke="#aa6a52" stroke-width="1.5"/>
    <rect x="1044" y="79" width="62" height="62" rx="7" fill="none" stroke="#aa6a52" stroke-width=".8"/>
    <text x="1075" y="122" text-anchor="middle" class="stamp">互</text>
  </g>

  <rect x="814" y="220" width="298" height="328" rx="9" fill="#e8eee2"/>
  <text x="48" y="250" class="column">WORKFLOW</text>
  <text x="252" y="250" class="column">1 / INPUT</text>
  <text x="482" y="250" class="column">2 / AI + SERVER CHECKS</text>
  <text x="837" y="250" class="column">3 / MEMBER DECISION</text>
  <path d="M48 267H1112M48 359H1112M48 451H1112M48 548H1112" class="divider"/>

  <g>
    <text x="48" y="303" class="japanese" lang="ja">相談</text>
    <text x="48" y="331" class="workflow">Find help</text>

    <text x="252" y="305" class="label">Describe a need</text>
    <text x="252" y="332" class="detail">Text, voice or photo</text>
    <use href="#otagai-ai-arrow" x="433" y="308" class="arrow"/>

    <text x="482" y="305" class="label">Interpret and search</text>
    <text x="482" y="332" class="detail">Filter matches by circle access</text>
    <use href="#otagai-ai-arrow" x="773" y="308" class="arrow arrow-final"/>

    <text x="837" y="305" class="label">Post a request</text>
    <text x="837" y="332" class="detail">Review the match or draft first</text>
  </g>

  <g>
    <text x="48" y="395" class="japanese" lang="ja">出品</text>
    <text x="48" y="423" class="workflow">List a tool</text>

    <text x="252" y="397" class="label">Add a tool photo</text>
    <text x="252" y="424" class="detail">Upload it once</text>
    <use href="#otagai-ai-arrow" x="433" y="400" class="arrow"/>

    <text x="482" y="397" class="label">Suggest listing fields</text>
    <text x="482" y="424" class="detail">Check category and lending mode</text>
    <use href="#otagai-ai-arrow" x="773" y="400" class="arrow arrow-final"/>

    <text x="837" y="397" class="label">Publish the listing</text>
    <text x="837" y="424" class="detail">Edit details and keep the photo</text>
  </g>

  <g>
    <text x="48" y="487" class="japanese" lang="ja">受け渡し</text>
    <text x="48" y="515" class="workflow">Pick up a tool</text>

    <text x="252" y="489" class="label">Add pickup photos</text>
    <text x="252" y="516" class="detail">Attach to the checklist</text>
    <use href="#otagai-ai-arrow" x="433" y="492" class="arrow"/>

    <text x="482" y="489" class="label">Suggest checklist items</text>
    <text x="482" y="516" class="detail">Use visible parts and quantities</text>
    <use href="#otagai-ai-arrow" x="773" y="492" class="arrow arrow-final"/>

    <text x="837" y="489" class="label">Confirm pickup</text>
    <text x="837" y="516" class="detail">Both confirm the same checklist</text>
  </g>
</svg>
</main>
</body>
</html>
